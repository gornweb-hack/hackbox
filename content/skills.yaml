# Навыки проводника — оси радара на главной. Первые четыре — шаги ролевой модели из памятки
# «Ситуации на борту»: признать ситуацию → обозначить правило → предложить решение → заверить.
#
# id ставится меткой у варианта ответа в сценарии: skills: [acknowledge, safety].
# Узел проверяет навык, если метка есть хотя бы у одного его варианта; выбрал вариант с меткой —
# решение верное. Навык в процентах = верные решения / решения, где он проверялся.
# timers: true — навык без меток: его проверяет каждый узел с таймером, верно — успеть до таймаута

# Процент считается по стольким последним прохождениям
window: 10

skills:
  - id: acknowledge
    title: Признать ситуацию
  - id: rule
    title: Обозначить правило
  - id: solution
    title: Предложить решение
  - id: reassure
    title: Заверить
  - id: safety
    title: Безопасность
  - id: composure
    title: Хладнокровие
    timers: true
