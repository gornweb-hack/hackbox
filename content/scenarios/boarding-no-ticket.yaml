# «Ситуации на борту», №1–2: посадка без действительного билета или документа
title: Посадка без билета
summary: Пассажир подошёл к вагону без действительного билета и настаивает на посадке.
category: boarding
carClass: Стандарт
durationMin: 3
order: 1

start: approach
nodes:
  approach:
    text: >-
      Посадка на поезд Москва — Санкт-Петербург, до отправления семь минут. Мужчина с чемоданом
      протягивает телефон: «Вот мой билет». Сканер показывает, что билета с таким номером нет,
      а за пассажиром уже собирается очередь.
    choices:
      - id: clarify
        text: >-
          «Позвольте уточнить, на каком ресурсе вы приобретали билет?» — и проверить номер заказа,
          дату и время отправления
        effects: {loyalty: 10, safety: 10}
        review: >-
          Хорошее начало: вы не обвиняете пассажира, а спокойно разбираетесь. Памятка советует
          проверить номер заказа, дату и время отправления и уточнить, где куплен билет.
        to: fake-site
      - id: let-in
        text: «Проходите, в пути разберёмся»
        effects: {loyalty: 15, safety: -25}
        review: >-
          Без действительного проездного документа посадка не осуществляется. Пассажир доволен
          сейчас, но это нарушение, и разбираться всё равно придётся — уже в пути.
        to: onboard-check
      - id: refuse
        text: «Билета нет — посадка невозможна. Отойдите, вы задерживаете людей»
        effects: {loyalty: -25, safety: 5}
        review: >-
          Правило вы назвали верно, но без признания ситуации и без решения. Лучше так:
          «Сожалею, но без действительного билета посадка не осуществляется. Я подскажу,
          куда можно обратиться».
        to: fake-site

  fake-site:
    text: >-
      Выясняется, что билет куплен на незнакомом сайте «со скидкой 40 %». Пассажир волнуется:
      «Мне срочно в Петербург, у меня важная встреча!»
    choices:
      - id: explain
        text: >-
          «Понимаю, что ситуация неприятная. Обращаю ваше внимание: билеты действительны, только
          если куплены через официальные каналы продажи. Касса — справа от входа на платформу,
          там помогут оформить билет»
        effects: {loyalty: 15, safety: 10}
        review: >-
          Точно по ролевой модели: признали ситуацию, обозначили правило и предложили решение.
          Пассажир понимает, что делать дальше.
        to: next-train
      - id: blame
        text: «Сами виноваты — покупать надо на официальном сайте»
        effects: {loyalty: -20}
        review: >-
          Упрёк не решает проблему и злит пассажира. Правило обозначают нейтрально: «Обращаю
          ваше внимание, что билеты продаются только через официальные каналы».
        # Если пассажир уже раздражён, он требует начальника поезда
        to:
          - if: {loyalty: {below: 40}}
            node: demands-chief
          - node: ok-end
      - id: sell-onboard
        text: «Садитесь, оформим билет у меня в вагоне»
        effects: {loyalty: 10, safety: -20}
        review: >-
          Посадка без действительного проездного документа не осуществляется, и продажа в вагоне
          её не заменяет. Правильно — направить пассажира в кассу или контактный центр.
        to: onboard-check

  next-train:
    text: «А если я не успею к отправлению?» — спрашивает пассажир.
    choices:
      - id: reassure
        text: >-
          «Благодарю за понимание. Если не успеете, в кассе оформят билет на ближайший поезд.
          Хорошей дороги!»
        effects: {loyalty: 15, safety: 5}
        review: >-
          Это шаг «заверить» из ролевой модели: пассажир уходит спокойным и с понятным планом.
        to: good-end
      - id: hold-train
        text: «Бегите, я попрошу машиниста немного подождать»
        effects: {loyalty: 10, safety: -20}
        review: >-
          Поезд отправляется строго по расписанию, задерживать его нельзя. Ложное обещание
          обернётся разочарованием: давайте только достоверную информацию.
        to: ok-end
      - id: not-my-job
        text: «Это уже вопрос к кассе, а не ко мне»
        effects: {loyalty: -15}
        review: >-
          Формально верно, но пассажир остаётся наедине с тревогой. Завершите разговор
          заверением: подскажите про ближайший поезд и поблагодарите за понимание.
        to: ok-end

  demands-chief:
    text: >-
      Пассажир повышает голос: «Позовите начальника поезда! Я буду жаловаться!» Очередь за ним
      растёт.
    choices:
      - id: call-chief
        text: >-
          «Понимаю ваше волнение. Сейчас приглашу начальника поезда, а вас попрошу пропустить
          пассажиров с билетами»
        effects: {loyalty: 10, safety: 15}
        review: >-
          Верно: в споре приглашают начальника поезда, а посадку остальных пассажиров не
          задерживают.
        to: ok-end
      - id: argue
        text: Продолжить спорить у двери вагона
        effects: {loyalty: -15, safety: -15}
        review: >-
          Спор у двери задерживает посадку и накаляет обстановку. Не вступайте в конфликт:
          пригласите начальника поезда и продолжайте работу.
        to: bad-end
      - id: give-in
        text: Пустить пассажира, лишь бы он успокоился
        effects: {loyalty: 10, safety: -25}
        review: >-
          Уступить давлению — значит нарушить правило посадки. Урегулировать спор поможет
          начальник поезда, а посадка без билета недопустима.
        to: onboard-check

  onboard-check:
    final: bad
    text: >-
      Поезд отправился. Через двадцать минут начальник поезда проверяет билеты и находит
      пассажира без действительного проездного документа. Его высадят на ближайшей станции,
      а к вам будут вопросы.
  bad-end:
    final: bad
    text: >-
      Спор у вагона задержал посадку, пассажиры с билетами недовольны. Начальника поезда
      пришлось звать уже в разгар скандала.
  ok-end:
    final: ok
    text: >-
      Посадка не сорвана, но пассажир ушёл недовольным. В следующий раз начните с признания
      ситуации — «Понимаю, что ситуация неприятная» — и сразу предложите решение.
  good-end:
    final: good
    text: >-
      Пассажир благодарит за подсказку и идёт в кассу. Посадка закончилась вовремя, очередь не
      пострадала.
