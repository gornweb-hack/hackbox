# «Ситуации на борту», №35: пассажир просит открыть окно — «подышать» можно
# только на станции, а стоянка длится одну минуту
title: Минутная стоянка
summary: Стоянка длится одну минуту, а пассажир хочет выйти подышать на платформу.
category: service
carClass: Стандарт
durationMin: 3
order: 4
new: true

start: stuffy
nodes:
  stuffy:
    text: >-
      Вагон 8, класс «Стандарт». Пассажирка подходит к вам: «Мне душно, откройте, пожалуйста,
      окно!» Поезд подходит к Твери, стоянка — одна минута.
    choices:
      - id: climate
        text: >-
          «Понимаю, что вам некомфортно. Окна в поезде не открываются, но я сейчас передам
          просьбу бортинженеру — температуру сделают комфортнее»
        effects: {loyalty: 15, safety: 10}
        review: >-
          По памятке: признали ситуацию, объяснили правило и предложили решение — регулировку
          климата через бортинженера.
        to: platform
      - id: try-window
        text: «Сейчас попробую открыть»
        effects: {loyalty: 5, safety: -10}
        review: >-
          Окна в поезде не открываются, и обещание невыполнимо — пассажирка решит, что её
          обманули. Сразу объясните техническую невозможность и предложите альтернативу.
        to: platform
      - id: ignore
        text: «Потерпите, скоро приедем»
        effects: {loyalty: -20}
        review: >-
          Жалобу нельзя оставлять без внимания. Выслушайте пассажира и предложите решение: климат,
          воду, место ближе к кондиционеру.
        to: platform

  platform:
    text: >-
      Поезд остановился в Твери, двери открыты. Пассажирка идёт к выходу: «Я выйду подышать на
      платформу, всего на минутку».
    timer: 20
    timeout:
      effects: {loyalty: -10, safety: -30}
      review: >-
        Пока вы решали, пассажирка вышла и отошла от вагона. Стоянка длится одну минуту, двери
        закрываются по расписанию. Решать нужно сразу: предупредить о времени или предложить
        тамбур.
      to: left-behind
    choices:
      - id: warn
        text: >-
          «Выйти можно под вашу ответственность: не отходите от вагона, стоянка одна минута.
          Я скажу, когда заходить»
        effects: {loyalty: 10, safety: -5}
        review: >-
          Допустимо по памятке: подышать на станции можно под личную ответственность и не отходя
          далеко. Но за временем теперь следите вы.
        to: doors
      - id: tambour
        text: «Предлагаю подышать в тамбуре у открытой двери — так вы точно не опоздаете к отправлению»
        effects: {loyalty: 15, safety: 20}
        review: >-
          Лучший вариант: пассажирке легче, а риск остаться на платформе исключён.
        to: aftercare
      - id: forbid
        text: «Выходить нельзя, вернитесь на место»
        effects: {loyalty: -20, safety: 10}
        review: >-
          Запрет без объяснения злит пассажирку, хотя на стоянке выйти можно. Объясните риск и
          предложите безопасный вариант — тамбур.
        # Если пассажирка уже раздражена, запрет перерастает в жалобу
        to:
          - if: {loyalty: {below: 40}}
            node: complaint
          - node: aftercare

  doors:
    text: Пассажирка на платформе, до отправления 15 секунд. Она отошла к киоску с водой.
    timer: 10
    timeout:
      effects: {safety: -30}
      review: >-
        Двери закрылись, а пассажирка осталась на платформе. Задерживать поезд и открывать двери
        после закрытия нельзя — за временем нужно было следить.
      to: left-behind
    choices:
      - id: call-back
        text: «Пожалуйста, пройдите в вагон — поезд отправляется!»
        effects: {loyalty: 5, safety: 15}
        review: >-
          Вовремя: пассажирка вернулась, поезд ушёл по расписанию.
        to: aftercare
      - id: hold-door
        text: Придержать дверь, пока она не вернётся
        effects: {loyalty: 10, safety: -25}
        review: >-
          Задерживать поезд нельзя: это угроза безопасности движения и сбой расписания. Позвать
          пассажирку нужно было заранее.
        to: delayed
      - id: go-fetch
        text: Выйти за пассажиркой к киоску
        effects: {safety: -20}
        review: >-
          Проводник не отходит от вагона во время стоянки. Позовите пассажирку от двери.
        to: delayed

  complaint:
    text: >-
      Пассажирка возмущена: «Вы разговариваете со мной, как с ребёнком! Где книга жалоб?»
    choices:
      - id: accept-complaint
        text: >-
          «Конечно, вы можете оставить обращение, я подскажу, как это сделать. А пока позвольте
          предложить воды и подышать в тамбуре»
        effects: {loyalty: 15, safety: 5}
        review: >-
          Отзыв — право пассажира, спорить не нужно. А предложив решение, вы можете урегулировать
          ситуацию прямо на борту.
        to: aftercare
      - id: brush-off
        text: «Жалобы пишите на сайте, я занят»
        effects: {loyalty: -15}
        review: >-
          Отказ помочь с обращением усиливает конфликт. Не спорьте: выполните просьбу и
          предложите решение.
        to: ok-end

  aftercare:
    text: Поезд отправился. Пассажирке всё ещё душно, она нервничает.
    choices:
      - id: water-feedback
        text: >-
          Принести воды, а через десять минут уточнить: «Как вы себя чувствуете? Стало
          комфортнее?»
        effects: {loyalty: 15, safety: 5}
        review: >-
          Заверить и взять обратную связь — обязательная часть сервиса: памятка требует
          интересоваться комфортом пассажира.
        to: good-end
      - id: move-seat
        text: Предложить пересесть ближе к кондиционеру, если есть свободное место
        effects: {loyalty: 10}
        review: >-
          Хорошая альтернатива из памятки. Не забудьте позже уточнить самочувствие.
        to: good-end
      - id: forget
        text: Вернуться к своим делам
        effects: {loyalty: -15}
        review: >-
          Проблема не решена: пассажирке по-прежнему душно. Предложите воду или пересадку и позже
          поинтересуйтесь комфортом.
        to: ok-end

  left-behind:
    final: bad
    text: >-
      Двери закрылись по расписанию, а пассажирка осталась на платформе без вещей. Начальнику
      поезда пришлось связываться со станцией.
  delayed:
    final: bad
    text: >-
      Поезд задержался на стоянке. Машинист и начальник поезда выясняют, почему нарушено
      расписание.
  ok-end:
    final: ok
    text: >-
      Поезд ушёл вовремя, но пассажирка осталась недовольна: духоту так и не решили до конца.
  good-end:
    final: good
    text: >-
      Пассажирке стало легче, она благодарит за заботу. Поезд ушёл по расписанию, никто не
      отстал.
