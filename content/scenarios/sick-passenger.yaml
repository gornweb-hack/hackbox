# «Ситуации на борту», №19: пассажиру стало плохо; №28: просьба дать лекарство
title: Пассажиру плохо на 400 км/ч
summary: Пассажиру в салоне стало плохо на полном ходу, до ближайшей станции ещё далеко.
category: medical
carClass: Комфорт
durationMin: 4
order: 3

start: alarm
nodes:
  alarm:
    text: >-
      Вагон 3, класс «Комфорт». Поезд идёт 400 км/ч, до Твери ещё 25 минут. Пассажирка машет
      вам: её соседу плохо — он бледный, тяжело дышит и держится за грудь.
    timer: 15
    timeout:
      effects: {loyalty: -10, safety: -25}
      review: >-
        Пока вы решали, пассажиру стало хуже. При угрозе здоровью действуют сразу: подойти,
        сказать «Я рядом» и вызвать начальника поезда любым доступным способом.
      to: worse
    choices:
      - id: call-chief
        text: >-
          Подойти: «Я рядом, сейчас приглашу начальника поезда и организуем помощь» — и вызвать
          начальника по рации
        effects: {loyalty: 15, safety: 20}
        review: >-
          Верно и быстро — ровно так, как в памятке. Вы признали ситуацию, не оставили пассажира и
          сразу подключили начальника поезда.
        to: medics
      - id: own-pills
        text: Предложить пассажиру свою таблетку от давления
        effects: {loyalty: 5, safety: -30}
        review: >-
          Личные лекарства давать нельзя: неизвестно, какой будет реакция, и ответственность
          ляжет на вас. Действуйте через начальника поезда и медиков.
        to: worse
      - id: finish-service
        text: «Минуту, я закончу раздачу напитков и подойду»
        effects: {loyalty: -20, safety: -20}
        review: >-
          Неотложная помощь всегда в приоритете. Обслуживание подождёт, пассажир с болью в
          груди — нет.
        to: worse

  worse:
    text: >-
      Пассажиру хуже: он почти не отвечает. Соседи встревожены, кто-то снимает происходящее на
      телефон.
    choices:
      - id: chief-now
        text: Срочно вызвать начальника поезда по рации и остаться рядом с пассажиром
        effects: {loyalty: 10, safety: 15}
        review: >-
          Правильно, но начальника нужно было вызвать сразу. Теперь главное — не отходить от
          пассажира.
        # После чужой таблетки ждать медиков из числа пассажиров некогда — сразу к станции
        to:
          - if: {safety: {below: 40}}
            node: station
          - node: medics
      - id: window-water
        text: Принести воды и попробовать открыть окно, чтобы было больше воздуха
        effects: {loyalty: 5, safety: -10}
        review: >-
          Окна в поезде не открываются, а вода не решает проблему. Нужны начальник поезда и
          медики — вызывайте их немедленно.
        to: bad-end
      - id: ask-neighbours
        text: Спросить у соседей, нет ли среди них врача
        effects: {loyalty: 5, safety: 5}
        review: >-
          Искать медиков среди пассажиров правильно, но через громкую связь и только после того,
          как вызван начальник поезда.
        to: medics

  medics:
    text: >-
      Начальник поезда уже идёт и просит вас объявить по громкой связи, нет ли среди пассажиров
      медиков. Соседи нервничают, одна пассажирка на грани паники.
    choices:
      - id: announce-calm
        text: >-
          Спокойно объявить: «Уважаемые пассажиры, если среди вас есть медицинский работник,
          просим подойти в третий вагон»
        effects: {loyalty: 10, safety: 15}
        review: >-
          Чёткое и спокойное объявление без лишних подробностей — так не допускают паники и
          находят помощь.
        to: doctor
      - id: announce-panic
        text: «Срочно! Человеку плохо, нужен врач, скорее!»
        effects: {loyalty: -10, safety: -10}
        review: >-
          Паника в голосе передаётся пассажирам. Объявление должно быть спокойным и конкретным:
          кого ищем и куда подойти.
        to: station
      - id: no-announce
        text: Не объявлять, чтобы не пугать пассажиров
        effects: {safety: -15}
        review: >-
          Памятка прямо рекомендует громкую связь, чтобы найти медиков среди пассажиров.
          Спокойное объявление не пугает, а помогает.
        to: station

  doctor:
    text: >-
      В вагон пришла пассажирка-терапевт. Она просит не давать никаких лекарств и вызвать скорую
      к ближайшей станции. Пассажир спрашивает вас: «Со мной всё будет хорошо?»
    choices:
      - id: reassure
        text: «Я рядом. Врач с вами, а на станции вас встретит бригада скорой помощи»
        effects: {loyalty: 15, safety: 5}
        review: >-
          Шаг «заверить»: спокойные слова и правдивая информация помогают пассажиру дождаться
          помощи.
        # Если в начале потеряли время, исход — «с замечаниями», даже когда финал сыгран верно
        to:
          - if: {safety: {below: 70}}
            node: ok-end
          - node: good-end
      - id: diagnose
        text: «Конечно, это просто давление, скоро пройдёт»
        effects: {loyalty: 5, safety: -10}
        review: >-
          Вы не врач и не можете ставить диагноз. Давайте только достоверную информацию: помощь
          рядом, на станции встретит скорая.
        to: ok-end
      - id: leave
        text: Вернуться к работе — врач ведь уже рядом
        effects: {loyalty: -15}
        review: >-
          Не оставляйте пассажира: памятка советует находиться рядом, проявить сочувствие и
          оказать посильную помощь.
        to: ok-end

  station:
    text: >-
      Врачей в поезде не нашлось. Начальник поезда вызвал скорую к станции Тверь, до неё
      10 минут. Пассажиру по-прежнему плохо.
    choices:
      - id: stay-close
        text: Остаться рядом, следить за состоянием и заранее подготовить выход к бригаде скорой
        effects: {loyalty: 10, safety: 15}
        review: >-
          Верно: пассажир не должен оставаться один, а выход к бригаде скорой готовят заранее.
        to: ok-end
      - id: kit-pills
        text: Дать таблетки из поездной аптечки на своё усмотрение
        effects: {safety: -15}
        review: >-
          Лекарства без назначения врача давать нельзя, даже из аптечки. Действуйте по указаниям
          начальника поезда и медиков.
        to: bad-end
      - id: hand-over
        text: Попросить соседей присмотреть за пассажиром и вернуться к обслуживанию
        effects: {loyalty: -15, safety: -10}
        review: >-
          Неотложная ситуация важнее обслуживания. Пассажир с болью в груди должен быть под
          присмотром сотрудника.
        to: bad-end

  bad-end:
    final: bad
    text: >-
      Пассажира передали скорой в тяжёлом состоянии. Помощь запоздала: начальника поезда и
      медиков нужно было подключить сразу.
  ok-end:
    final: ok
    text: >-
      Пассажира передали бригаде скорой помощи на станции, но не всё прошло гладко: время было
      упущено или пассажира оставляли без внимания.
  good-end:
    final: good
    text: >-
      На станции пассажира встретила бригада скорой помощи. Врач похвалила экипаж: помощь
      организовали быстро и без паники.
