# «Ситуации на борту», №33: два пассажира на одно место; №23–24: спор и грубость
title: Два пассажира на одно место
summary: На одно место претендуют два пассажира с билетами, и спор становится громче.
category: conflict
carClass: Комфорт
durationMin: 4
order: 2

start: dispute
nodes:
  dispute:
    text: >-
      Вагон 5, класс «Комфорт». У места 12А стоят двое пассажиров и показывают вам билеты:
      у обоих одно и то же место, и оба уверены, что правы. Соседи оборачиваются.
    choices:
      - id: check-both
        text: «Давайте решим вопрос спокойно. Позвольте ваши билеты — я проверю оба»
        effects: {loyalty: 15, safety: 10}
        review: >-
          Правильно: вы признали ситуацию и не заняли ничью сторону. Памятка требует внимательно
          проверить оба проездных документа.
        to: both-valid
      - id: first-come
        text: «Кто первый сел, тот и едет, а второму я найду другое место»
        effects: {loyalty: -15, safety: -5}
        review: >-
          Так вы занимаете сторону, не выяснив причину. Второй пассажир чувствует
          несправедливость, и спор разгорается.
        to: escalation
      - id: walk-away
        text: «Разберитесь, пожалуйста, между собой, я скоро подойду»
        effects: {loyalty: -20, safety: -15}
        review: >-
          Оставить конфликт без внимания — худший вариант. Развести стороны и разобраться —
          задача проводника.
        to: escalation

  both-valid:
    text: >-
      Оба билета действительны — похоже на сбой при продаже. Второй пассажир нервничает:
      «Я заплатил за это место и никуда не уйду!»
    choices:
      - id: call-chief
        text: >-
          «Я вижу, что ситуация требует уточнения. Сейчас приглашу начальника поезда, он проверит
          сведения о продаже»
        effects: {loyalty: 10, safety: 15}
        review: >-
          Точно по памятке: при двух билетах на одно место приглашают начальника поезда. Он
          уточнит информацию о сбое у ответственных лиц.
        to: offer-seat
      - id: decide-alone
        text: Самому решить, кто из пассажиров останется на месте
        effects: {loyalty: -10, safety: -10}
        review: >-
          Разбираться со сбоем при продаже — задача начальника поезда. Не берите на себя то, что
          он уточнит у ответственных лиц.
        to: escalation
      - id: promise-upgrade
        text: «Не переживайте, я пересажу вас в Бизнес-класс»
        effects: {loyalty: 15, safety: -10}
        review: >-
          Пересадку с повышением класса без доплаты может предложить только начальник поезда и
          только при наличии мест. Не обещайте того, что не можете гарантировать.
        to: offer-seat

  escalation:
    text: >-
      Спор перешёл на крик, один из пассажиров хватает другого за рукав. Соседи просят вас
      вмешаться.
    timer: 20
    timeout:
      effects: {loyalty: -10, safety: -20}
      review: >-
        Пока вы медлили, ссора переросла в потасовку. При угрозе конфликта нужно сразу развести
        пассажиров и вызвать начальника поезда, а при необходимости — сотрудников ПТБ.
      to: bad-end
    choices:
      - id: separate
        text: >-
          Встать между пассажирами: «Прошу вас сохранять спокойствие. Я приглашаю начальника
          поезда»
        effects: {loyalty: 10, safety: 10}
        review: >-
          Верно: вы развели стороны, не занимая ничьей позиции, и вызвали начальника поезда.
        # Если обстановка уже накалена, без сотрудников ПТБ не обойтись
        to:
          - if: {safety: {below: 50}}
            node: security
          - node: offer-seat
      - id: threaten
        text: «Прекратите немедленно, или вас высадят!»
        effects: {loyalty: -15, safety: -5}
        review: >-
          Угрозы провоцируют агрессию. Держитесь достойно и корректно: «Я готов помочь вам, но
          прошу общаться корректно».
        to: security
      - id: radio-ptb
        text: Вызвать по рации начальника поезда и сотрудников ПТБ, оставаясь в стороне
        effects: {loyalty: 5, safety: 10}
        review: >-
          При угрозе безопасности ПТБ вызывают любым оперативным способом, но пассажиров нельзя
          оставлять без внимания: встаньте между ними и попросите сохранять спокойствие.
        to: security

  security:
    text: >-
      Пришли начальник поезда и сотрудник ПТБ, пассажиров развели по разным концам вагона.
      Начальник поезда просит вас помочь второму пассажиру.
    choices:
      - id: find-seat
        text: >-
          Найти свободное место в этом классе и проводить пассажира: «Благодарю вас за понимание
          и ожидание»
        effects: {loyalty: 15, safety: 5}
        review: >-
          Хорошее завершение: решение найдено, пассажира заверили. После ссоры важно вернуть в
          вагон спокойствие.
        to: ok-end
      - id: back-to-work
        text: Вернуться к обслуживанию — дальше разберутся без вас
        effects: {loyalty: -10}
        review: >-
          Ссору остановили, но пассажир без места остался с ощущением, что им никто не
          занимается. Доведите дело до конца и возьмите обратную связь.
        to: ok-end

  offer-seat:
    text: >-
      Начальник поезда подтвердил сбой при продаже. В вагоне Бизнес-класса есть свободное место,
      и он разрешает пересадку без доплаты. Как предложить её второму пассажиру?
    choices:
      - id: offer-politely
        text: >-
          Отойти с пассажиром в сторону: «Приносим извинения за неудобства. Позвольте проводить
          вас в Бизнес-класс — благодарю за понимание»
        effects: {loyalty: 20, safety: 5}
        review: >-
          Решение из памятки и заверение. Пассажир уходит с ощущением заботы, а не уступки.
        to: good-end
      - id: order-move
        text: «Переходите в Бизнес-класс, так решил начальник поезда»
        effects: {loyalty: -5}
        review: >-
          Решение верное, но подача приказная. Лучше предложить, а не распорядиться, и
          поблагодарить за понимание.
        to: ok-end
      - id: ask-publicly
        text: Спросить при всём вагоне, кто готов уступить место
        effects: {loyalty: -10, safety: -5}
        review: >-
          Публичный вопрос снова сталкивает пассажиров. Решение предлагают каждому отдельно, не
          при соседях.
        to:
          - if: {loyalty: {below: 40}}
            node: security
          - node: ok-end

  bad-end:
    final: bad
    text: >-
      Ссора на глазах у всего вагона закончилась вмешательством сотрудников ПТБ. Пассажиры
      написали жалобу.
  ok-end:
    final: ok
    text: >-
      Места распределены, но осадок остался: кто-то из пассажиров недоволен тем, как с ним
      говорили.
  good-end:
    final: good
    text: >-
      Оба пассажира едут на своих местах, второй — в Бизнес-классе. В вагоне спокойно, соседи
      благодарят за быстрое решение.
