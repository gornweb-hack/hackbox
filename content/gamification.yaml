# Правила геймификации. Опыт, уровень и репутация считаются из журнала прохождений
# при каждом запросе, поэтому правка этого файла сразу пересчитывает всех

# Уровни: скорость на спидометре, титул и сколько нужно опыта. Первый порог — 0
levels:
  - {speed: 60, title: Стажёр, xp: 0}
  - {speed: 120, title: Проводник, xp: 300}
  - {speed: 200, title: Старший проводник, xp: 800}
  - {speed: 250, title: Наставник смены, xp: 1500}
  - {speed: 300, title: Инструктор бригады, xp: 2500}
  - {speed: 400, title: Мастер ВСМ, xp: 4000}

# Опыт за прохождение по исходу
xp:
  good: 150
  ok: 100
  bad: 50

# Репутация — среднее итоговых шкал за столько последних прохождений
reputation:
  window: 10
