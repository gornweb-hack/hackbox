# Настройки для разработки и демо. Порт базы открыт только на localhost,
# поэтому простые пароли допустимы. Локально через .env меняются только порты.
x-db-env: &db-env
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_DB: app

services:
  postgres:
    image: postgres:17-alpine
    # Запас соединений: пулы ORM растут с числом ядер, 100 по умолчанию может не хватить
    command: ["postgres", "-c", "max_connections=300"]
    environment:
      <<: *db-env
      # Сортировка по-русски (ICU). Применяется только при создании базы
      POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=ru-RU"
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # По TCP: через сокет база отвечает «готова» ещё во время инициализации
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Роль ядра и владение базой. Отрабатывает при каждом `up` и завершается: Exited (0) — это норма
  db-init:
    image: postgres:17-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *db-env
      CORE_DB_PASSWORD: core_pass
    volumes:
      - ./infra/postgres/bootstrap.sh:/bootstrap.sh:ro
    entrypoint: ["bash", "/bootstrap.sh"]
    restart: "no"

  # События (стрим events). AOF: переживает перезапуск
  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "redis_pass"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis_pass", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Ядро: весь бэкенд и единственная точка входа для фронта. От Redis зависит
  # только по порядку запуска: без него ядро работает, но события не ходят
  core:
    build: ./core
    restart: unless-stopped
    depends_on:
      db-init:
        condition: service_completed_successfully
      redis:
        condition: service_started
    environment:
      PORT: "4000"
      DATABASE_URL: postgres://core_svc:core_pass@postgres:5432/app
      REDIS_URL: redis://:redis_pass@redis:6379
      # Через сколько миллисекунд необработанное событие повторяется
      EVENTS_RETRY_MS: "30000"
      # Вход пользователей. Для демо ACCESS_TTL можно поднять, например, до 8h
      JWT_SECRET: dev-secret-change-me
      ACCESS_TTL: 15m
      REFRESH_TTL_DAYS: "30"
      # Самостоятельная регистрация; по умолчанию аккаунты заводит админ
      REGISTRATION_OPEN: "false"
      ADMIN_LOGIN: admin
      ADMIN_PASSWORD: admin123
      # Демо-аккаунты manager/manager123 и user/user123
      SEED_DEMO_USERS: "true"
    ports:
      - "127.0.0.1:${CORE_PORT:-4000}:4000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/api/health || exit 1"]
      interval: 5s
      timeout: 4s
      retries: 5
      start_period: 20s

  # Фронт (Next.js). /api/* он проксирует в ядро: один адрес для страниц, cookie и SSE
  web:
    build:
      context: ./web
      args:
        CORE_URL: http://core:4000
    restart: unless-stopped
    depends_on:
      core:
        condition: service_started
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"

volumes:
  pgdata:
  redisdata:
