# Настройки для разработки и демо. Порт базы открыт только на localhost,
# поэтому простые пароли допустимы. Локально через .env меняются только порты.
x-db-env: &db-env
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_DB: app

# Модули через запятую — один список для базы (db-init) и ядра (core).
# Для каждого создаются схема <name> и роль <name>_svc
x-modules: &modules tpl_go,tpl_py

# Общее для всех модулей (docs/module-contract.md)
x-module: &module
  restart: unless-stopped
  depends_on:
    db-init:
      condition: service_completed_successfully

services:
  postgres:
    image: postgres:17-alpine
    # Запас соединений: пулы ORM растут с числом ядер, 100 по умолчанию может не хватить
    command: ["postgres", "-c", "max_connections=300"]
    environment:
      <<: *db-env
      # Сортировка по-русски (ICU). Применяется только при создании базы
      POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=ru-RU"
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # По TCP: через сокет база отвечает «готова» ещё во время инициализации
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Роли и схемы. Отрабатывает при каждом `up` и завершается: Exited (0) — это норма
  db-init:
    image: postgres:17-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *db-env
      CORE_DB_PASSWORD: core_pass
      MODULE_DB_PASSWORD: module_pass
      DB_MODULES: *modules
    volumes:
      - ./infra/postgres/bootstrap.sh:/bootstrap.sh:ro
    entrypoint: ["bash", "/bootstrap.sh"]
    restart: "no"

  # Ядро: единственная точка входа для фронта. От модулей не зависит
  core:
    build: ./core
    restart: unless-stopped
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      PORT: "4000"
      DATABASE_URL: postgres://core_svc:core_pass@postgres:5432/app
      MODULES: *modules
    ports:
      - "127.0.0.1:${CORE_PORT:-4000}:4000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/api/health || exit 1"]
      interval: 5s
      timeout: 4s
      retries: 5
      start_period: 20s

  # Модуль: раскомментируйте, замените <name> и порт 81NN (docs/module-contract.md)
  # <name>:
  #   <<: *module
  #   build: ./modules/<name>
  #   environment:
  #     PORT: "8080"
  #     DATABASE_URL: postgres://<name>_svc:module_pass@postgres:5432/app
  #   ports:
  #     - "127.0.0.1:81NN:8080"   # отладка: http://127.0.0.1:81NN/health

volumes:
  pgdata:
